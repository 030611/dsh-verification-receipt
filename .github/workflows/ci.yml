name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - name: Verify package manager
        run: test "$(pnpm --version)" = 11.19.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify peers
        run: pnpm peers check
      - name: Check package
        run: pnpm run check
      - name: Verify packed artifact
        run: pnpm run release:smoke
      - name: Run performance smoke
        run: pnpm run performance:smoke
