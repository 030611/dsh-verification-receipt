<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">DSH Verification Receipt data flow</title>
  <desc id="desc">Existing DeepSeek Harness session events are inspected in memory, reduced to coarse verification-shaped signals, and appended as independent privacy-minimal JSONL rows. Prompt text, tool arguments, tool results, and message text are not persisted.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#93c5fd"/>
    </marker>
    <style>
      .title { font: 700 28px ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .label { font: 700 19px ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .body { font: 15px ui-sans-serif, system-ui, sans-serif; fill: #cbd5e1; }
      .small { font: 14px ui-sans-serif, system-ui, sans-serif; fill: #bfdbfe; }
      .box { fill: #111827; stroke: #60a5fa; stroke-width: 2; rx: 14; }
    </style>
  </defs>
  <rect width="1200" height="440" rx="24" fill="url(#background)"/>
  <text x="60" y="62" class="title">Verification-shaped signals, not a correctness claim</text>

  <rect x="60" y="105" width="290" height="175" class="box"/>
  <text x="90" y="145" class="label">Existing DSH events</text>
  <text x="90" y="180" class="body">tool/call · tool/result</text>
  <text x="90" y="208" class="body">turn/end · recorded status</text>
  <text x="90" y="248" class="small">Read only after the turn ends</text>

  <path d="M365 192 H455" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="470" y="105" width="270" height="175" class="box"/>
  <text x="500" y="145" class="label">In-memory projection</text>
  <text x="500" y="180" class="body">Lexical classification</text>
  <text x="500" y="208" class="body">Coarse observed status</text>
  <text x="500" y="248" class="small">No model or tool is invoked</text>

  <path d="M755 192 H845" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="860" y="105" width="280" height="175" class="box"/>
  <text x="890" y="145" class="label">Local JSONL receipt</text>
  <text x="890" y="180" class="body">Counts · coarse categories</text>
  <text x="890" y="208" class="body">Status · independent row hash</text>
  <text x="890" y="248" class="small">Append-only writer per process</text>

  <rect x="60" y="320" width="1080" height="72" rx="12" fill="#3f1d2e" stroke="#fb7185" stroke-width="2"/>
  <text x="90" y="350" class="label">Not persisted</text>
  <text x="250" y="350" class="body">prompt text · tool arguments · tool results · user/assistant message text · raw session ID</text>
  <text x="90" y="378" class="small">Not a signature, trusted timestamp, hash chain, or proof that tests ran or passed.</text>
</svg>
